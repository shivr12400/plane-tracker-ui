<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="t">
  <title id="t">Typical airliner flight profile</title>
  <rect width="880" height="320" fill="#0c1215"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="80" y="40" width="760" height="62" fill="#00ffcc" opacity="0.06"/>
    <text x="832" y="58" font-size="12" fill="#0b8f77" text-anchor="end">airliner cruise band, FL300–FL400</text>
    <line x1="80" y1="190" x2="840" y2="190" stroke="#8fa0a0" stroke-dasharray="4 6" opacity="0.6"/>
    <text x="832" y="183" font-size="12" fill="#8fa0a0" text-anchor="end">10,000 ft — 250-knot limit below</text>
    <line x1="80" y1="260" x2="840" y2="260" stroke="#dbe5e5" stroke-width="2"/>
    <line x1="80" y1="30" x2="80" y2="260" stroke="#dbe5e5" stroke-width="1.5"/>
    <g font-size="12" fill="#8fa0a0" text-anchor="end">
      <text x="72" y="264">0</text><text x="72" y="194">10,000</text><text x="72" y="124">20,000</text><text x="72" y="60">35,000</text>
    </g>
    <path d="M100 258 C130 230 150 160 200 110 S260 66 300 64 L620 64 C680 66 720 120 760 190 S805 250 822 258"
          fill="none" stroke="#00ffcc" stroke-width="3"/>
    <g font-size="13" fill="#dbe5e5" font-weight="700">
      <text x="128" y="150">Climb</text>
      <text x="420" y="88">Cruise</text>
      <text x="705" y="140">Descent</text>
    </g>
    <g font-size="12" fill="#8fa0a0">
      <text x="100" y="282">Take-off</text>
      <text x="790" y="282">Landing</text>
      <text x="420" y="106">level, fast, steady</text>
      <text x="700" y="158">starts 100+ miles out</text>
    </g>
  </g>
</svg>
