<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="t">
  <title id="t">Six common aircraft layouts seen from below</title>
  <rect width="880" height="360" fill="#0c1215"/>
  <defs>
    <style>
      .b{fill:#dbe5e5}.e{fill:#00ffcc}.p{stroke:#00ffcc;stroke-width:2.5}
      text{font-family:Helvetica,Arial,sans-serif;fill:#dbe5e5;font-size:13px;text-anchor:middle}
      .s{fill:#8fa0a0;font-size:11.5px}
    </style>
  </defs>
  <!-- 1 four-engine widebody -->
  <g transform="translate(147 88)">
    <rect class="b" x="-7" y="-70" width="14" height="140" rx="7"/>
    <polygon class="b" points="-6,-10 -78,30 -78,38 -6,14 6,14 78,38 78,30 6,-10"/>
    <polygon class="b" points="-5,52 -30,66 -30,71 -5,64 5,64 30,71 30,66 5,52"/>
    <ellipse class="e" cx="-30" cy="12" rx="4.5" ry="10"/><ellipse class="e" cx="-56" cy="24" rx="4" ry="9"/>
    <ellipse class="e" cx="30" cy="12" rx="4.5" ry="10"/><ellipse class="e" cx="56" cy="24" rx="4" ry="9"/>
  </g>
  <text x="147" y="182">Four engines under the wings</text><text class="s" x="147" y="198">747, A380, A340</text>
  <!-- 2 twin widebody -->
  <g transform="translate(440 88)">
    <rect class="b" x="-7" y="-68" width="14" height="136" rx="7"/>
    <polygon class="b" points="-6,-8 -80,30 -80,37 -6,14 6,14 80,37 80,30 6,-8"/>
    <polygon class="b" points="-5,50 -30,64 -30,69 -5,62 5,62 30,69 30,64 5,50"/>
    <ellipse class="e" cx="-36" cy="14" rx="6" ry="12"/><ellipse class="e" cx="36" cy="14" rx="6" ry="12"/>
  </g>
  <text x="440" y="182">Two engines, wide fuselage</text><text class="s" x="440" y="198">777, 787, A330, A350</text>
  <!-- 3 twin narrowbody -->
  <g transform="translate(733 92)">
    <rect class="b" x="-5" y="-56" width="10" height="112" rx="5"/>
    <polygon class="b" points="-4,-6 -60,24 -60,30 -4,12 4,12 60,30 60,24 4,-6"/>
    <polygon class="b" points="-4,40 -24,52 -24,56 -4,50 4,50 24,56 24,52 4,40"/>
    <ellipse class="e" cx="-24" cy="10" rx="4.5" ry="9"/><ellipse class="e" cx="24" cy="10" rx="4.5" ry="9"/>
  </g>
  <text x="733" y="182">Two engines, slim fuselage</text><text class="s" x="733" y="198">737, A320 family</text>
  <!-- 4 rear-engine regional jet -->
  <g transform="translate(147 268)">
    <rect class="b" x="-5" y="-52" width="10" height="104" rx="5"/>
    <polygon class="b" points="-4,-8 -54,16 -54,22 -4,8 4,8 54,22 54,16 4,-8"/>
    <polygon class="b" points="-3,44 -22,52 -22,56 -3,52 3,52 22,56 22,52 3,44"/>
    <ellipse class="e" cx="-11" cy="30" rx="4" ry="9"/><ellipse class="e" cx="11" cy="30" rx="4" ry="9"/>
  </g>
  <text x="147" y="340">Engines on the rear fuselage</text><text class="s" x="147" y="356">CRJ, ERJ, business jets</text>
  <!-- 5 twin turboprop -->
  <g transform="translate(440 268)">
    <rect class="b" x="-5" y="-50" width="10" height="100" rx="5"/>
    <rect class="b" x="-70" y="-6" width="140" height="11" rx="3"/>
    <polygon class="b" points="-3,40 -22,44 -22,49 -3,47 3,47 22,49 22,44 3,40"/>
    <rect class="e" x="-30" y="-16" width="8" height="24" rx="3"/><rect class="e" x="22" y="-16" width="8" height="24" rx="3"/>
    <line class="p" x1="-40" y1="-18" x2="-12" y2="-18"/><line class="p" x1="12" y1="-18" x2="40" y2="-18"/>
  </g>
  <text x="440" y="340">Two propellers, straight wing</text><text class="s" x="440" y="356">ATR 72, Dash 8, light twins</text>
  <!-- 6 single engine -->
  <g transform="translate(733 270)">
    <rect class="b" x="-5" y="-40" width="10" height="80" rx="5"/>
    <rect class="b" x="-56" y="-12" width="112" height="10" rx="3"/>
    <polygon class="b" points="-3,30 -18,34 -18,38 -3,36 3,36 18,38 18,34 3,30"/>
    <line class="p" x1="-15" y1="-43" x2="15" y2="-43"/>
  </g>
  <text x="733" y="340">One propeller at the nose</text><text class="s" x="733" y="356">Cessna, Piper, Cirrus</text>
</svg>
