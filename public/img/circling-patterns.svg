<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="t">
  <title id="t">Three circling patterns seen from above: a racetrack holding pattern, a tight orbit around one point, and a back-and-forth survey grid</title>
  <rect width="880" height="320" fill="#071413"/>
  <g font-family="ui-monospace, Menlo, monospace" fill="#9fd9cc" font-size="15" text-anchor="middle">
    <!-- Panel 1: holding pattern -->
    <g transform="translate(147,0)">
      <rect x="-127" y="20" width="254" height="240" rx="10" fill="none" stroke="#1d3a36"/>
      <path d="M-70 95 H60 A45 45 0 0 1 60 185 H-70 A45 45 0 0 1 -70 95 Z" fill="none" stroke="#00ffcc" stroke-width="3" stroke-dasharray="9 7"/>
      <path d="M10 95 l-12 -7 v14 z" fill="#00ffcc"/>
      <path d="M-10 185 l12 -7 v14 z" fill="#00ffcc"/>
      <circle cx="-70" cy="185" r="6" fill="#ffb800"/>
      <text x="-70" y="214" font-size="12" fill="#ffb800">fix</text>
      <text x="0" y="290" font-size="17" fill="#e8fff9">Holding pattern</text>
      <text x="0" y="310" font-size="12">airliners · 5,000–15,000 ft · ~4 min loop</text>
    </g>
    <!-- Panel 2: tight orbit -->
    <g transform="translate(440,0)">
      <rect x="-127" y="20" width="254" height="240" rx="10" fill="none" stroke="#1d3a36"/>
      <circle cx="0" cy="140" r="70" fill="none" stroke="#00ffcc" stroke-width="3" stroke-dasharray="9 7"/>
      <path d="M0 70 l-12 -7 v14 z" fill="#00ffcc" transform="rotate(180 0 70)"/>
      <circle cx="0" cy="140" r="6" fill="#ffb800"/>
      <text x="0" y="168" font-size="12" fill="#ffb800">point of interest</text>
      <text x="0" y="290" font-size="17" fill="#e8fff9">Orbit over one spot</text>
      <text x="0" y="310" font-size="12">police · news · photo · training</text>
    </g>
    <!-- Panel 3: survey grid -->
    <g transform="translate(733,0)">
      <rect x="-127" y="20" width="254" height="240" rx="10" fill="none" stroke="#1d3a36"/>
      <path d="M-90 60 H90 A15 15 0 0 1 90 90 H-90 A15 15 0 0 0 -90 120 H90 A15 15 0 0 1 90 150 H-90 A15 15 0 0 0 -90 180 H90 A15 15 0 0 1 90 210 H-90" fill="none" stroke="#00ffcc" stroke-width="3" stroke-dasharray="9 7"/>
      <path d="M0 60 l-12 -7 v14 z" fill="#00ffcc" transform="rotate(180 0 60)"/>
      <text x="0" y="290" font-size="17" fill="#e8fff9">Survey grid</text>
      <text x="0" y="310" font-size="12">mapping · lidar · steady height for hours</text>
    </g>
  </g>
</svg>
